<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>エルドラド遠征録 — 戦闘レイヤー試作 v2</title>
<style>
:root{--gold:#c9a45e;--blue:#10243d;--panel:#071526;--line:#b98d43}*{box-sizing:border-box}body{margin:0;background:#061222;color:#f7ead0;font-family:"Yu Mincho",serif}.app{width:min(1600px,100%);margin:auto;padding:8px}.top{height:58px;border:1px solid var(--gold);background:#0b1c30;padding:8px 18px;display:flex;justify-content:space-between;align-items:center}.title{font-size:25px;letter-spacing:.12em}.sub{font-size:11px;color:#d8bd83}.stage{height: min(66vw,690px);min-height:440px;position:relative;overflow:hidden;border:2px solid var(--gold);margin-top:8px;background:#15253a}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%;z-index:0}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,15,30,.05) 45%,rgba(3,13,26,.55));z-index:1}.msg{position:absolute;z-index:8;top:18px;left:24%;width:52%;padding:12px;background:#071526eF;border:1px solid var(--gold);border-radius:9px;text-align:center;font-weight:bold}.auto{position:absolute;right:18px;top:16px;z-index:9;background:#102b46;border:1px solid var(--gold);padding:10px 18px;border-radius:8px;color:#fff}.actor{position:absolute;z-index:3;bottom:9%;height:68%;width:auto;max-width:31%;object-fit:contain;filter:drop-shadow(0 12px 8px #0009);transform-origin:bottom center}.fel{left:7%;height:70%}.alice{left:24%;height:68%}.wolf{right:6%;height:57%;bottom:13%}.label{position:absolute;z-index:5;bottom:7%;font: bold 14px Arial;color:#fff;text-shadow:0 2px 4px #000}.lf{left:15%}.la{left:34%}.lw{right:17%}.link .alice{filter:drop-shadow(0 0 16px #74dfff) drop-shadow(0 0 28px #398cff)}.floor{position:absolute;z-index:2;bottom:9%;height:2px;left:0;right:0;background:linear-gradient(90deg,transparent,#d4b66d99,transparent)}.hud{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;margin-top:-1px;position:relative;z-index:10}.panel{min-height:190px;background:linear-gradient(145deg,#0b1b30f5,#07111ff7);border:2px solid var(--gold);border-radius:12px;padding:12px;box-shadow:0 4px 18px #0008}.party{border-color:#4aa9e8}.enemy{border-color:#d74e59;text-align:right}.unit{padding:3px 0 8px;border-bottom:1px solid #52627a;margin-bottom:5px}.unit:last-child{border:0}.name{font-size:20px;font-weight:bold}.meta{font-size:12px;color:#a9c4e0}.bar{height:8px;background:#23374e;border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#28a9ef,#80d8ff)}.enemy .bar i{background:linear-gradient(90deg,#e34450,#ffae74)}.commands{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;align-content:center}.commands button{background:linear-gradient(#1c3857,#0d1d31);border:1px solid #6f91b2;color:#fff;border-radius:7px;padding:12px 5px;font: bold 15px serif;cursor:pointer}.commands button:hover,.commands button.active{outline:2px solid #65cfff;box-shadow:0 0 14px #36bfff}.log{grid-column:1/-1;border-top:1px solid #526b85;margin-top:6px;padding:8px;font-size:13px;min-height:32px}.bottom{display:flex;justify-content:center;gap:12px;padding:10px}.bottom button{background:#102b46;color:#fff;border:1px solid var(--gold);border-radius:7px;padding:9px 20px;cursor:pointer}
@media(max-width:760px){.stage{min-height:390px;height:58vh}.fel{left:0;height:57%}.alice{left:19%;height:55%}.wolf{right:0;height:45%}.hud{grid-template-columns:1fr}.panel{min-height:auto}.msg{left:4%;width:72%;font-size:12px}.title{font-size:18px}}
</style></head><body><main class="app"><header class="top"><div><div class="title">エルドラド遠征録</div><div class="sub">戦闘レイヤー構造 v2 — 背景・キャラクター・UI独立</div></div><div class="sub">第1章　天空の遺跡・東の丘　☀ 晴れ</div></header>
<section class="stage" id="stage"><img class="bg" src="assets/battle_background.jpg" alt="戦闘背景"><div class="shade"></div><div class="msg" id="message">ワイルドウルフが現れた！　フェルたちはどうする？</div><button class="auto" id="auto">AUTO OFF</button>
<img class="actor fel" src="assets/fel.png" alt="フェル"><img class="actor alice" id="alice" src="assets/alice.png" alt="アリス"><img class="actor wolf" src="assets/wild_wolf.png" alt="ワイルドウルフ"><div class="floor"></div><span class="label lf">フェル</span><span class="label la">アリス</span><span class="label lw">ワイルドウルフ</span></section>
<section class="hud"><div class="panel party"><div class="unit"><div class="name">フェル　<span class="meta">Lv.22 / 近接アタッカー</span></div><div>HP <b id="felhp">260 / 260</b></div><div class="bar"><i id="felbar" style="width:100%"></i></div><div>MP 90 / 90</div></div><div class="unit"><div class="name">アリス　<span class="meta">Lv.22 / 治癒術師・魔導士</span></div><div id="aliceState">通常状態</div><div>HP <b id="alicehp">240 / 240</b></div><div class="bar"><i id="alicebar" style="width:100%"></i></div><div>MP 260 / 260</div></div></div>
<div class="panel commands"><button class="active" data-cmd="攻撃">⚔ 攻撃</button><button data-cmd="スキル">✧ スキル</button><button data-cmd="魔法">✦ 魔法</button><button data-cmd="防御">🛡 防御</button><button data-cmd="アイテム">◇ アイテム</button><button id="link">共鳴・リンク</button><div class="log" id="log">攻撃：装備した二刀流の剣で敵単体を攻撃します。</div></div>
<div class="panel enemy"><div class="name">ワイルドウルフ　<span class="meta">敵 MOB / Lv.10</span></div><div>HP <b id="wolfhp">320 / 320</b></div><div class="bar"><i id="wolfbar" style="width:100%"></i></div><div class="meta" id="wolfstate">交戦中</div></div></section><footer class="bottom"><button id="reset">戦闘リセット</button></footer></main>
<script>
const $=id=>document.getElementById(id);let wolf=320,fel=260,alice=240,linked=false,auto=false,timer=null;
function render(){$('wolfhp').textContent=wolf+' / 320';$('wolfbar').style.width=(wolf/320*100)+'%';$('felhp').textContent=fel+' / 260';$('felbar').style.width=(fel/260*100)+'%';$('alicehp').textContent=alice+' / 240';$('alicebar').style.width=(alice/240*100)+'%';$('wolfstate').textContent=wolf<=0?'撃破':'交戦中'}
function hit(n){if(wolf<=0)return;wolf=Math.max(0,wolf-n);$('message').textContent=wolf<=0?'ワイルドウルフを撃破した！':'フェルの二刀流攻撃！ '+n+' ダメージ';$('log').textContent='ワイルドウルフに '+n+' のダメージ。';render()}
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-cmd]').forEach(x=>x.classList.remove('active'));b.classList.add('active');let c=b.dataset.cmd;$('log').textContent=c+'を選択しました。'+(c==='魔法'?' アリスは光属性・治癒系魔法を使用できます。':'');if(c==='攻撃')hit(48);if(c==='防御')$('log').textContent='防御態勢を取りました。'});
$('link').onclick=()=>{linked=!linked;$('stage').classList.toggle('link',linked);$('alice').src=linked?'assets/alice_link.png':'assets/alice.png';$('aliceState').textContent=linked?'共鳴・リンク状態':'通常状態';$('log').textContent=linked?'フェルとアリスが共鳴しました。':'共鳴を解除しました。'};
$('reset').onclick=()=>{wolf=320;fel=260;alice=240;linked=false;$('stage').classList.remove('link');$('alice').src='assets/alice.png';$('aliceState').textContent='通常状態';$('message').textContent='ワイルドウルフが現れた！　フェルたちはどうする？';$('log').textContent='戦闘をリセットしました。';render()};
$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'AUTO ON':'AUTO OFF';if(timer)clearInterval(timer);timer=auto?setInterval(()=>{if(wolf<=0){auto=false;$('auto').textContent='AUTO OFF';clearInterval(timer);return}hit(24)},1400):null};render();
</script></body></html>
